apiVersion: v2
name: litefuse
version: 1.0.0
description: Open source LLM engineering platform backed by Apache Doris - LLM observability, metrics, evaluations, prompt management.
type: application
keywords:
  - litefuse
  - llm
  - observability
  - doris
  - prompt management
  - metrics
sources:
  - https://github.com/litefuse/litefuse
  - https://github.com/litefuse/litefuse-k8s
dependencies:
  - name: postgres
    version: 1.6.3
    repository: https://groundhog2k.github.io/helm-charts/
    condition: postgresql.deploy
    alias: postgresql
  - name: valkey
    version: 0.9.4
    repository: https://valkey-io.github.io/valkey-helm
    condition: redis.deploy
    alias: redis
  - name: seaweedfs
    version: 4.23.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: s3.deploy
    alias: s3
  # Doris Operator - provides the DorisCluster CRD used to run the bundled
  # Doris FE/BE cluster. Set doris.operator.enabled=false if the operator is
  # already installed cluster-wide.
  - name: doris-operator
    version: 25.8.0
    repository: https://charts.selectdb.com
    condition: doris.operator.enabled
    alias: dorisOperator
maintainers:
  - name: litefuse
appVersion: "26.2.0"
