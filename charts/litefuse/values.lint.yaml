# This file is used to validate the Chart and sets some values for required fields. It is not used for the deployment.
# Example usage: `helm lint . --values values.lint.yaml`
litefuse:
  salt:
    value: "secretSalt"
  nextauth:
    secret:
      value: "secretSecret"

postgresql:
  auth:
    password: "secretPassword"

doris:
  # Offline lint/unit-test rendering has no cluster API discovery — skip the CRD preflight.
  crdCheck: false

redis:
  auth:
    password: "secretPassword"
