{{- if ((.Values.litefuse.worker).hpa).enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "litefuse.fullname" . }}-worker
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "litefuse.labels" . | nindent 4 }}
  {{- with .Values.litefuse.worker.hpa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "litefuse.fullname" . }}-worker
  minReplicas: {{ .Values.litefuse.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.litefuse.worker.hpa.maxReplicas }}
  metrics:
    {{- with .Values.litefuse.worker.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.litefuse.worker.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
